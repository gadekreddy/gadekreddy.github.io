<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Trinadh Industries</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <div class="nav-brand-icon">T</div>
        <span>Trinadh Industries — Admin</span>
      </a>
      <ul class="nav-menu">
        <li><a href="products.html">View site</a></li>
        <li><a href="#" id="signOutBtn">Sign Out</a></li>
      </ul>
    </div>
  </nav>

  <!-- Admin Container -->
  <div class="admin-container" style="margin-top: 80px;">
    <div class="admin-header">
      <h1>Admin Panel</h1>
      <div class="admin-actions">
        <button class="btn btn-primary" id="addCompoundBtn">
          <i class="fas fa-plus"></i> Add Compound
        </button>
      </div>
    </div>

    <div class="admin-grid">
      <!-- Add Compound Form -->
      <div class="admin-card" id="addCompoundForm" style="display: none;">
        <h2>Add a Compound</h2>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">Fields marked * are required. New compounds appear on the public Products page immediately.</p>
        
        <form id="compoundForm">
          <div class="form-group">
            <label class="form-label">Name *</label>
            <input type="text" class="form-input" id="compoundName" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">CAS No.</label>
            <input type="text" class="form-input" id="compoundCas">
          </div>
          
          <div class="form-group">
            <label class="form-label">Molecular Formula (MF)</label>
            <input type="text" class="form-input" id="compoundMf">
          </div>
          
          <div class="form-group">
            <label class="form-label">Molecular Weight (MW)</label>
            <input type="text" class="form-input" id="compoundMw">
          </div>
          
          <div class="form-group">
            <label class="form-label">SMILES</label>
            <input type="text" class="form-input" id="compoundSmiles">
          </div>
          
          <div class="form-group">
            <label class="form-label">InChIKey</label>
            <input type="text" class="form-input" id="compoundInchikey">
          </div>
          
          <div class="form-group">
            <label class="form-label">Image URL</label>
            <input type="url" class="form-input" id="compoundImage">
          </div>
          
          <div class="form-group">
            <label class="form-label">IUPAC Name</label>
            <input type="text" class="form-input" id="compoundIupac">
          </div>
          
          <div class="form-group">
            <label class="form-label">Synonyms</label>
            <input type="text" class="form-input" id="compoundSynonyms">
          </div>
          
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select class="form-select" id="compoundCategory" required>
              <option value="">Select category...</option>
              <option value="peptide-apis">Peptide APIs</option>
              <option value="other-apis">Other APIs</option>
              <option value="manufacturing">Supplying & Manufacturing</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label">Grade</label>
            <input type="text" class="form-input" id="compoundGrade" placeholder="USP, BP, EP, etc.">
          </div>
          
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" id="compoundDescription" rows="3"></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">Display order</label>
            <input type="number" class="form-input" id="compoundOrder" value="0">
          </div>
          
          <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Add Compound
            </button>
            <button type="button" class="btn btn-outline" id="cancelBtn">
              Cancel
            </button>
          </div>
        </form>
      </div>

      <!-- Existing Compounds Table -->
      <div class="admin-card">
        <h2>Existing Compounds</h2>
        
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>CAS No.</th>
                <th>Category</th>
                <th>Grade</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="compoundsTableBody">
              <tr>
                <td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                  <i class="fas fa-spinner fa-spin"></i> Loading…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    
    // Auth check
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        loadCompounds();
      }
    });
    
    // Sign out
    document.getElementById('signOutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });
    
    // Toggle add form
    const addCompoundBtn = document.getElementById('addCompoundBtn');
    const addCompoundForm = document.getElementById('addCompoundForm');
    const cancelBtn = document.getElementById('cancelBtn');
    
    addCompoundBtn.addEventListener('click', () => {
      addCompoundForm.style.display = 'block';
    });
    
    cancelBtn.addEventListener('click', () => {
      addCompoundForm.style.display = 'none';
    });
    
    // Add compound
    document.getElementById('compoundForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const compound = {
        name: document.getElementById('compoundName').value,
        cas: document.getElementById('compoundCas').value,
        mf: document.getElementById('compoundMf').value,
        mw: document.getElementById('compoundMw').value,
        smiles: document.getElementById('compoundSmiles').value,
        inchikey: document.getElementById('compoundInchikey').value,
        image: document.getElementById('compoundImage').value,
        iupac: document.getElementById('compoundIupac').value,
        synonyms: document.getElementById('compoundSynonyms').value,
        category: document.getElementById('compoundCategory').value,
        grade: document.getElementById('compoundGrade').value,
        description: document.getElementById('compoundDescription').value,
        order: parseInt(document.getElementById('compoundOrder').value) || 0,
        createdAt: new Date().toISOString()
      };
      
      try {
        await addDoc(collection(db, 'compounds'), compound);
        alert('Compound added successfully!');
        document.getElementById('compoundForm').reset();
        addCompoundForm.style.display = 'none';
        loadCompounds();
      } catch (error) {
        alert('Error adding compound: ' + error.message);
      }
    });
    
    // Load compounds
    async function loadCompounds() {
      const tbody = document.getElementById('compoundsTableBody');
      
      try {
        const snapshot = await getDocs(collection(db, 'compounds'));
        tbody.innerHTML = '';
        
        snapshot.forEach(doc => {
          const data = doc.data();
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${data.name || 'N/A'}</strong></td>
            <td class="mono">${data.cas || 'N/A'}</td>
            <td><span class="status-badge status-active">${data.category || 'N/A'}</span></td>
            <td class="mono">${data.grade || 'N/A'}</td>
            <td>
              <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="deleteCompound('${doc.id}')">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
        
        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-muted);">No compounds found</td></tr>';
        }
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--error);">Error loading compounds</td></tr>';
      }
    }
    
    // Delete compound
    window.deleteCompound = async (id) => {
      if (confirm('Are you sure you want to delete this compound?')) {
        try {
          await deleteDoc(doc(db, 'compounds', id));
          loadCompounds();
        } catch (error) {
          alert('Error deleting compound: ' + error.message);
        }
      }
    };
  </script>
</body>
</html>
